<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>我的小店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f4f7;color:#1f2329;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
.hero{background:linear-gradient(135deg,#07c160,#06ad56);color:#fff;padding:26px 20px 22px;border-radius:0 0 20px 20px;text-align:center;margin-bottom:14px}
.hero .logo{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.22);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.hero h1{font-size:22px}
.hero .s{font-size:13px;opacity:.92;margin-top:4px}
.notice{background:#eafaf1;border:1px solid #b7ecca;color:#0a8a42;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.card{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.card h3{font-size:17px;margin-bottom:4px}
.card .d{color:#8a9099;font-size:13px;margin-bottom:12px}
.card .row{display:flex;align-items:center;justify-content:space-between}
.price{color:#fa5151;font-size:22px;font-weight:700}
.price::before{content:"¥";font-size:15px;margin-right:1px}
.btn{border:none;border-radius:24px;padding:10px 22px;font-size:15px;cursor:pointer}
.btn-green{background:#07c160;color:#fff}
.btn-green:active{background:#06ad56}
.btn-block{width:100%;padding:13px;font-size:16px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.mask.show{display:flex}
.modal{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 20px 28px;max-height:92vh;overflow:auto;position:relative}
@media(min-width:600px){.mask{align-items:center}.modal{border-radius:20px}}
.close{position:absolute;top:12px;right:16px;font-size:26px;line-height:1;border:none;background:none;color:#a0a4aa;cursor:pointer}
.modal h2{font-size:19px;margin-bottom:14px}
.muted{color:#8a9099;font-size:13px}
label{display:block;font-size:13px;color:#646a73;margin:14px 0 6px}
.inp{width:100%;border:1px solid #dcdfe6;border-radius:10px;padding:12px 14px;font-size:15px}
.inp:focus{outline:none;border-color:#07c160}
.amount{text-align:center;background:#fff7f5;border-radius:14px;padding:14px;margin:14px 0}
.amount .l{font-size:13px;color:#8a9099}
.amount .n{font-size:36px;color:#fa5151;font-weight:700}
.amount .t{font-size:12px;color:#b0807a}
.qrbox{width:260px;max-width:80%;margin:6px auto 10px;background:#fff;border:1px solid #eee;border-radius:12px;padding:10px}
.qrbox img{width:100%;display:block}
.steps{list-style:none;font-size:13px;color:#555;margin:8px 2px;}
.steps li{margin:5px 0}
.getbox{background:#eafaf1;border:1px solid #b7ecca;border-radius:12px;padding:12px 14px;font-size:13px;color:#0a8a42;margin-top:12px}
.getbox b{color:#07c160}
.wxbox{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px dashed #07c160;border-radius:12px;padding:12px;margin-top:10px;font-size:16px;font-weight:600;color:#07c160}
.meta{font-size:12px;color:#a0a4aa;text-align:center;margin-top:8px}
.foot{text-align:center;color:#b0b4ba;font-size:12px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo" id="logo">店</div>
    <h1 id="shopName"></h1>
    <div class="s">微信扫码支付 · 付款后联系客服领取</div>
  </div>
  <div class="notice" id="notice"></div>
  <div id="grid"></div>
  <div class="foot">本页面为自助下单入口，付款后请凭「商品名+付款名称」联系客服领取</div>
</div>

<div class="mask" id="m1">
  <div class="modal">
    <button class="close" onclick="closeM('m1')">×</button>
    <h2 id="m1title">确认下单</h2>
    <div class="muted" id="m1desc"></div>
    <label>商品价格</label>
    <div class="price" id="m1price" style="font-size:24px"></div>
    <label>请填写你的微信昵称 / 备注（用于核对到账）</label>
    <input class="inp" id="buyer" maxlength="30" placeholder="例如：你的微信昵称">
    <div style="margin-top:16px"><button class="btn btn-green btn-block" onclick="goPay()">生成订单 · 去扫码支付</button></div>
  </div>
</div>

<div class="mask" id="m2">
  <div class="modal">
    <button class="close" onclick="closeM('m2')">×</button>
    <h2 style="text-align:center">微信扫码支付</h2>
    <div class="amount">
      <div class="l">请支付精确金额（务必一致，用于核对）</div>
      <div class="n" id="amt">0.00</div>
      <div class="t">金额含识别尾数，方便客服确认是你付的款</div>
    </div>
    <div class="qrbox"><img id="qr" alt="微信收款码"></div>
    <ul class="steps">
      <li>① 打开微信「扫一扫」，扫描上方收款码</li>
      <li>② 手动输入金额 <b id="amt2"></b> 元并完成付款</li>
      <li>③ 付款后添加下方客服微信，把【商品名+付款名称】发给客服</li>
    </ul>
    <div class="getbox">✅ 付款完成后，客服核对到账会<b>立即把商品链接发给你</b>，请保留支付凭证。</div>
    <div class="wxbox">💬 客服微信：<span id="svcwx"></span></div>
    <div class="meta" id="meta"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const DATA = {"shop": "我的小店", "notice": "", "wx": "请先填写你的微信号", "products": [{"id": "p1001", "name": "示例商品 A · 电子资料", "price": 9.9, "desc": "拍下后自动发放网盘链接（示例，请在后台修改）", "active": true}, {"id": "p1002", "name": "示例商品 B · 软件授权", "price": 19.9, "desc": "拍下后自动发放授权/下载链接（示例，请在后台修改）", "active": true}]};
let cur=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(id){document.getElementById(id).classList.add('show');}
function closeM(id){document.getElementById(id).classList.remove('show');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function init(){
  document.title=DATA.shop;
  document.getElementById('shopName').textContent=DATA.shop;
  document.getElementById('logo').textContent=DATA.shop.slice(0,1);
  document.getElementById('svcwx').textContent=DATA.wx;
  const n=document.getElementById('notice');
  if(DATA.notice){n.textContent='📢 '+DATA.notice;}else{n.textContent='📢 下单后请按页面显示的精确金额扫码付款，付款后添加客服微信领取商品链接。';}
  const g=document.getElementById('grid');
  if(!DATA.products.length){g.innerHTML='<div class="card">暂无在售商品</div>';return;}
  g.innerHTML=DATA.products.map(p=>`
    <div class="card">
      <h3>${esc(p.name)}</h3><div class="d">${esc(p.desc||'')}</div>
      <div class="row">
        <div class="price">${Number(p.price).toFixed(2)}</div>
        <button class="btn btn-green" onclick='buy(${JSON.stringify(p)})'>立即购买</button>
      </div>
    </div>`).join('');
}
function buy(p){
  cur=p;
  document.getElementById('m1title').textContent='购买：'+p.name;
  document.getElementById('m1desc').textContent=p.desc||'';
  document.getElementById('m1price').textContent='¥'+Number(p.price).toFixed(2);
  document.getElementById('buyer').value='';
  show('m1');
}
function goPay(){
  const name=document.getElementById('buyer').value.trim();
  if(!name){toast('请填写微信昵称/备注');return;}
  const amt=(Number(cur.price)+(Math.floor(Math.random()*99)+1)/100).toFixed(2);
  document.getElementById('amt').textContent=amt;
  document.getElementById('amt2').textContent=amt;
  document.getElementById('meta').textContent='商品：'+cur.name+'　付款名称：'+name;
  closeM('m1');show('m2');
}
